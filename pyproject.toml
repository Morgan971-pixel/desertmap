[project]
name = "desertmap"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "geopandas>=0.14.0",
    "gradio>=4.44.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "pydeck>=0.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "shap>=0.43.0",
    "shapely>=2.0.0",
    "streamlit>=1.28.0",
]

[tool.uv]
constraint-dependencies = ["llvmlite>=0.44", "numba>=0.60"]
